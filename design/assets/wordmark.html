<!-- @dsCard group="Brand" viewport="700x180" name="Wordmark treatment (no logo supplied)" subtitle="Chivo 900 lowercase + optional 6px green listening dot" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px 20px; background: var(--bg-window); }
  .row { display: flex; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: var(--space-2); }
  .chip { width: 84px; height: 44px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 0.5px var(--border-hairline); }
  .lbl { font: var(--type-mono-xs); color: var(--text-muted); letter-spacing: var(--tracking-mono); }
  .lbl b { color: var(--text-body); font-weight: 400; display: block; }
  .tag { font: var(--type-micro); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-faint); }

</style>
</head>
<body>
<div style="display:flex;gap:44px;align-items:center;flex-wrap:wrap">
  <div style="display:flex;align-items:center;gap:8px"><span style="font-family:var(--font-sans);font-weight:900;font-size:48px;letter-spacing:-0.03em;color:var(--text-title)">ouvi</span><span style="width:9px;height:9px;border-radius:50%;background:var(--live);margin-bottom:14px"></span></div>
  <div style="display:flex;align-items:center;gap:6px"><span style="font-family:var(--font-sans);font-weight:900;font-size:20px;letter-spacing:-0.03em;color:var(--text-title)">ouvi</span><span style="width:5px;height:5px;border-radius:50%;background:var(--live);margin-bottom:6px"></span></div>
  <div style="max-width:34ch" class="lbl">No mark was provided and none was drawn. Set the name in Chivo 900, lowercase, -0.03em. The dot is optional and only appears where "listening" is the message.</div>
</div>
</body>
</html>
