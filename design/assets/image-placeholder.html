<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px 20px; background: var(--bg-window); }
  .slot {
    height: 118px;
    border-radius: var(--radius-lg);
    background: repeating-linear-gradient(135deg, var(--bg-inset) 0 10px, var(--bg-window) 10px 20px);
    box-shadow: inset 0 0 0 0.5px var(--border-strong);
    display: flex; align-items: center; justify-content: center;
  }
  .cap {
    font: var(--type-mono-xs); letter-spacing: var(--tracking-mono);
    color: var(--text-faint); background: var(--bg-surface);
    padding: 4px 8px; border-radius: var(--radius-xs);
  }
</style>
</head>
<body>
  <div style="display:grid;grid-template-columns:1.6fr 1fr;gap:16px">
    <div class="slot"><span class="cap">captura de tela — janela principal gravando (1180×700)</span></div>
    <div class="slot"><span class="cap">app icon · 512×512</span></div>
  </div>
</body>
</html>
