<!-- @dsCard group="Colors" viewport="700x130" name="Status colors" subtitle="Amber = cloud was used. Red = destructive only. Blue is not used in chrome." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px 20px; background: var(--bg-window); }
  .row { display: flex; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: var(--space-2); }
  .chip { width: 84px; height: 44px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 0.5px var(--border-hairline); }
  .lbl { font: var(--type-mono-xs); color: var(--text-muted); letter-spacing: var(--tracking-mono); }
  .lbl b { color: var(--text-body); font-weight: 400; display: block; }
  .tag { font: var(--type-micro); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-faint); }

</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#b7791f"></div><div class="lbl"><b>--caution</b>cloud badge</div></div>
  <div class="sw"><div class="chip" style="background:#fbf1dd"></div><div class="lbl"><b>--caution-soft</b></div></div>
  <div class="sw"><div class="chip" style="background:#c4462f"></div><div class="lbl"><b>--danger</b>destructive</div></div>
  <div class="sw"><div class="chip" style="background:#fbe9e5"></div><div class="lbl"><b>--danger-soft</b></div></div>
  <div class="sw"><div class="chip" style="background:#3b6fd4"></div><div class="lbl"><b>--info</b>speaker only</div></div>
  <div class="sw"><div class="chip" style="background:#e6ecfa"></div><div class="lbl"><b>--info-soft</b></div></div>
</div>
</body>
</html>
