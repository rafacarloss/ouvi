<!-- @dsCard group="Colors" viewport="700x130" name="Speaker colors" subtitle="Fixed 5 slots; used as 3px name rules and dots, never as text or fills" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px 20px; background: var(--bg-window); }
  .row { display: flex; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: var(--space-2); }
  .chip { width: 84px; height: 44px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 0.5px var(--border-hairline); }
  .lbl { font: var(--type-mono-xs); color: var(--text-muted); letter-spacing: var(--tracking-mono); }
  .lbl b { color: var(--text-body); font-weight: 400; display: block; }
  .tag { font: var(--type-micro); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-faint); }

</style>
</head>
<body>
<div style="display:flex;gap:24px;flex-wrap:wrap">
  <div style="display:flex;gap:9px"><div style="width:3px;border-radius:2px;background:var(--speaker-me)"></div><div><div style="font:var(--type-ui-medium);color:var(--text-body)">Você / You</div><div class="lbl">--speaker-me</div></div></div><div style="display:flex;gap:9px"><div style="width:3px;border-radius:2px;background:var(--speaker-a)"></div><div><div style="font:var(--type-ui-medium);color:var(--text-body)">Falante 1</div><div class="lbl">--speaker-a</div></div></div><div style="display:flex;gap:9px"><div style="width:3px;border-radius:2px;background:var(--speaker-b)"></div><div><div style="font:var(--type-ui-medium);color:var(--text-body)">Falante 2</div><div class="lbl">--speaker-b</div></div></div><div style="display:flex;gap:9px"><div style="width:3px;border-radius:2px;background:var(--speaker-c)"></div><div><div style="font:var(--type-ui-medium);color:var(--text-body)">Falante 3</div><div class="lbl">--speaker-c</div></div></div><div style="display:flex;gap:9px"><div style="width:3px;border-radius:2px;background:var(--speaker-d)"></div><div><div style="font:var(--type-ui-medium);color:var(--text-body)">Falante 4</div><div class="lbl">--speaker-d</div></div></div>
</div>
</body>
</html>
