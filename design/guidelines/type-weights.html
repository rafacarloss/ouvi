<!-- @dsCard group="Type" viewport="700x140" name="Chivo weights in use" subtitle="Only 300 / 400 / 500 / 700 / 900 — nothing in between" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px 20px; background: var(--bg-window); }
  .row { display: flex; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: var(--space-2); }
  .chip { width: 84px; height: 44px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 0.5px var(--border-hairline); }
  .lbl { font: var(--type-mono-xs); color: var(--text-muted); letter-spacing: var(--tracking-mono); }
  .lbl b { color: var(--text-body); font-weight: 400; display: block; }
  .tag { font: var(--type-micro); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-faint); }

</style>
</head>
<body>
<div style="display:flex;gap:26px;align-items:baseline;flex-wrap:wrap">
  <div><div style="font-family:var(--font-sans);font-weight:300;font-size:26px;letter-spacing:var(--tracking-title);color:var(--text-title)">Ouvi</div><div class="lbl">300 · Light — site lede only</div></div><div><div style="font-family:var(--font-sans);font-weight:400;font-size:26px;letter-spacing:var(--tracking-title);color:var(--text-title)">Ouvi</div><div class="lbl">400 · Regular — body</div></div><div><div style="font-family:var(--font-sans);font-weight:500;font-size:26px;letter-spacing:var(--tracking-title);color:var(--text-title)">Ouvi</div><div class="lbl">500 · Medium — labels</div></div><div><div style="font-family:var(--font-sans);font-weight:700;font-size:26px;letter-spacing:var(--tracking-title);color:var(--text-title)">Ouvi</div><div class="lbl">700 · Bold — titles</div></div><div><div style="font-family:var(--font-sans);font-weight:900;font-size:26px;letter-spacing:var(--tracking-title);color:var(--text-title)">Ouvi</div><div class="lbl">900 · Black — brand</div></div>
</div>
</body>
</html>
