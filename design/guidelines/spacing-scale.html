<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px grid; chrome uses 8/12/16, reading uses 20/24/32" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px 20px; background: var(--bg-window); }
  .row { display: flex; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: var(--space-2); }
  .chip { width: 84px; height: 44px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 0.5px var(--border-hairline); }
  .lbl { font: var(--type-mono-xs); color: var(--text-muted); letter-spacing: var(--tracking-mono); }
  .lbl b { color: var(--text-body); font-weight: 400; display: block; }
  .tag { font: var(--type-micro); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-faint); }

</style>
</head>
<body>
<div style="display:flex;align-items:flex-end;gap:10px">
  <div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:4px;height:4px;background:var(--accent);opacity:.85;border-radius:2px"></div><span class="lbl" style="text-align:center">1<br>4px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:6px;height:6px;background:var(--accent);opacity:.85;border-radius:2px"></div><span class="lbl" style="text-align:center">2<br>6px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:8px;height:8px;background:var(--accent);opacity:.85;border-radius:2px"></div><span class="lbl" style="text-align:center">3<br>8px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:12px;height:12px;background:var(--accent);opacity:.85;border-radius:2px"></div><span class="lbl" style="text-align:center">4<br>12px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:16px;height:16px;background:var(--accent);opacity:.85;border-radius:2px"></div><span class="lbl" style="text-align:center">5<br>16px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:20px;height:20px;background:var(--accent);opacity:.85;border-radius:2px"></div><span class="lbl" style="text-align:center">6<br>20px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:24px;height:24px;background:var(--accent);opacity:.85;border-radius:2px"></div><span class="lbl" style="text-align:center">7<br>24px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:32px;height:32px;background:var(--accent);opacity:.85;border-radius:2px"></div><span class="lbl" style="text-align:center">8<br>32px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:40px;height:40px;background:var(--accent);opacity:.85;border-radius:2px"></div><span class="lbl" style="text-align:center">9<br>40px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:56px;height:56px;background:var(--accent);opacity:.85;border-radius:2px"></div><span class="lbl" style="text-align:center">10<br>56px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:72px;height:72px;background:var(--accent);opacity:.85;border-radius:2px"></div><span class="lbl" style="text-align:center">11<br>72px</span></div>
</div>
</body>
</html>
