<!-- @dsCard group="Brand" viewport="700x150" name="Status vocabulary" subtitle="Glyph or color never speaks alone — always paired with a label" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px 20px; background: var(--bg-window); }
  .row { display: flex; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: var(--space-2); }
  .chip { width: 84px; height: 44px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 0.5px var(--border-hairline); }
  .lbl { font: var(--type-mono-xs); color: var(--text-muted); letter-spacing: var(--tracking-mono); }
  .lbl b { color: var(--text-body); font-weight: 400; display: block; }
  .tag { font: var(--type-micro); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-faint); }

</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:10px;font:var(--type-ui)">
  <div style="display:flex;gap:10px;align-items:center"><span style="width:8px;height:8px;border-radius:50%;background:var(--live);box-shadow:var(--glow-live)"></span><b style="font-weight:500">AO VIVO</b><span style="color:var(--text-muted)">gravando agora</span></div>
  <div style="display:flex;gap:10px;align-items:center"><span style="width:8px;height:8px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--accent)"></span><b style="font-weight:500">ARMADO</b><span style="color:var(--text-muted)">pronto, aguardando a reunião começar</span></div>
  <div style="display:flex;gap:10px;align-items:center"><span style="font:var(--type-mono-xs);padding:3px 7px;border-radius:var(--radius-pill);background:var(--accent-soft);color:var(--accent-soft-text)">LOCAL</span><span style="color:var(--text-muted)">processado neste Mac</span></div>
  <div style="display:flex;gap:10px;align-items:center"><span style="font:var(--type-mono-xs);padding:3px 7px;border-radius:var(--radius-pill);background:var(--caution-soft);color:var(--caution)">NUVEM</span><span style="color:var(--text-muted)">só o texto do transcript foi enviado</span></div>
</div>
</body>
</html>
