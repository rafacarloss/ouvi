<!-- @dsCard group="Spacing" viewport="700x160" name="Elevation — five levels" subtitle="Every shadow carries a 0.5px ring for Retina definition" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px 20px; background: var(--bg-window); }
  .row { display: flex; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: var(--space-2); }
  .chip { width: 84px; height: 44px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 0.5px var(--border-hairline); }
  .lbl { font: var(--type-mono-xs); color: var(--text-muted); letter-spacing: var(--tracking-mono); }
  .lbl b { color: var(--text-body); font-weight: 400; display: block; }
  .tag { font: var(--type-micro); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-faint); }

</style>
</head>
<body>
<div style="display:flex;gap:16px;flex-wrap:wrap">
  <div class="sw"><div style="width:112px;height:62px;border-radius:var(--radius-sm);background:var(--bg-surface);box-shadow:var(--shadow-control)"></div><span class="lbl"><b>--shadow-control</b></span></div><div class="sw"><div style="width:112px;height:62px;border-radius:10px;background:var(--bg-surface);box-shadow:var(--shadow-card)"></div><span class="lbl"><b>--shadow-card</b></span></div><div class="sw"><div style="width:112px;height:62px;border-radius:10px;background:var(--bg-surface);box-shadow:var(--shadow-raised)"></div><span class="lbl"><b>--shadow-raised</b></span></div><div class="sw"><div style="width:112px;height:62px;border-radius:10px;background:var(--bg-surface);box-shadow:var(--shadow-popover)"></div><span class="lbl"><b>--shadow-popover</b></span></div><div class="sw"><div style="width:112px;height:62px;border-radius:14px;background:var(--bg-surface);box-shadow:var(--shadow-sheet)"></div><span class="lbl"><b>--shadow-sheet</b></span></div>
</div>
</body>
</html>
