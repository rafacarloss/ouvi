<!-- @dsCard group="Colors" viewport="700x150" name="Signal green" subtitle="One accent, one meaning: local and listening" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px 20px; background: var(--bg-window); }
  .row { display: flex; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: var(--space-2); }
  .chip { width: 84px; height: 44px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 0.5px var(--border-hairline); }
  .lbl { font: var(--type-mono-xs); color: var(--text-muted); letter-spacing: var(--tracking-mono); }
  .lbl b { color: var(--text-body); font-weight: 400; display: block; }
  .tag { font: var(--type-micro); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-faint); }

</style>
</head>
<body>
<div class="row">
  <div class="sw"><div class="chip" style="background:#e4f4ec"></div><div class="lbl"><b>--green-100</b>selected bg</div></div>
  <div class="sw"><div class="chip" style="background:#c2e6d4"></div><div class="lbl"><b>--green-200</b></div></div>
  <div class="sw"><div class="chip" style="background:#8ed3b1"></div><div class="lbl"><b>--green-300</b></div></div>
  <div class="sw"><div class="chip" style="background:#2e9e6b"></div><div class="lbl"><b>--green-500</b>accent</div></div>
  <div class="sw"><div class="chip" style="background:#237f56"></div><div class="lbl"><b>--green-600</b>hover</div></div>
  <div class="sw"><div class="chip" style="background:#1a6244"></div><div class="lbl"><b>--green-700</b>press</div></div>
  <div class="sw"><div class="chip" style="background:#0d2a1e"></div><div class="lbl"><b>--green-950</b></div></div>
</div>
<div style="margin-top:14px;display:flex;gap:10px;align-items:center">
  <span style="display:inline-flex;align-items:center;gap:7px;font:var(--type-micro);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--accent-soft-text);background:var(--accent-soft);padding:4px 8px;border-radius:var(--radius-pill)"><span style="width:6px;height:6px;border-radius:50%;background:var(--live);box-shadow:var(--glow-live)"></span>ao vivo</span>
  <span style="font:var(--type-caption);color:var(--text-muted)">record button · live dot · selected row · focus ring · links · LOCAL badge. Nothing else.</span>
</div>
</body>
</html>
