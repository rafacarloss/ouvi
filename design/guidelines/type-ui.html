<!-- @dsCard group="Type" viewport="700x180" name="UI scale — 13px baseline" subtitle="A Mac app, not a website: 13px body, 12px caption, 11px meta" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px 20px; background: var(--bg-window); }
  .row { display: flex; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: var(--space-2); }
  .chip { width: 84px; height: 44px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 0.5px var(--border-hairline); }
  .lbl { font: var(--type-mono-xs); color: var(--text-muted); letter-spacing: var(--tracking-mono); }
  .lbl b { color: var(--text-body); font-weight: 400; display: block; }
  .tag { font: var(--type-micro); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-faint); }

</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:8px">
  <div style="font:var(--type-title-3);color:var(--text-title)">--type-title-3 · 16/500 · panel headers</div>
  <div style="font:var(--type-ui-medium);color:var(--text-body)">--type-ui-medium · 13/500 · selected rows, buttons</div>
  <div style="font:var(--type-ui);color:var(--text-body)">--type-ui · 13/400 · the default for all chrome</div>
  <div style="font:var(--type-caption);color:var(--text-muted)">--type-caption · 12/400 · help text, list metadata</div>
  <div style="font:var(--type-micro);text-transform:uppercase;letter-spacing:var(--tracking-label);color:var(--text-faint)">--type-micro · 10/500 · uppercase, 0.08em tracking</div>
</div>
</body>
</html>
