<!-- @dsCard group="Spacing" viewport="700x190" name="Layout constants in use" subtitle="Sidebar 248 · transcript rail 340 · titlebar 38 · rows 30/56" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px 20px; background: var(--bg-window); }
  .row { display: flex; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: var(--space-2); }
  .chip { width: 84px; height: 44px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 0.5px var(--border-hairline); }
  .lbl { font: var(--type-mono-xs); color: var(--text-muted); letter-spacing: var(--tracking-mono); }
  .lbl b { color: var(--text-body); font-weight: 400; display: block; }
  .tag { font: var(--type-micro); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-faint); }

</style>
</head>
<body>
<div style="height:150px;display:grid;grid-template-columns:180px 1fr 120px;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-card)">
  <div style="background:var(--bg-sidebar);border-right:1px solid var(--border-hairline);padding:10px"><span class="lbl">--sidebar-width<br>248px</span></div>
  <div style="background:var(--bg-surface);padding:10px"><span class="lbl">content · --reading-measure 68ch</span>
    <div style="margin-top:10px;display:flex;flex-direction:column;gap:4px">
      <div style="height:30px;border-radius:var(--radius-sm);background:var(--bg-hover)"></div><div style="height:30px;border-radius:var(--radius-sm);background:var(--bg-hover)"></div><div style="height:30px;border-radius:var(--radius-sm);background:var(--bg-hover)"></div>
    </div>
    <span class="lbl">--row-height 30px</span>
  </div>
  <div style="background:var(--bg-inset);border-left:1px solid var(--border-hairline);padding:10px"><span class="lbl">--transcript-width<br>340px</span></div>
</div>
</body>
</html>
