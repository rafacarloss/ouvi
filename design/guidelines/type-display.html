<!-- @dsCard group="Type" viewport="700x230" name="Display — Chivo" subtitle="900 for hero, 700 for display/titles, negative tracking above 23px" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>
  body { padding: 16px 20px; background: var(--bg-window); }
  .row { display: flex; align-items: flex-end; gap: var(--space-4); flex-wrap: wrap; }
  .sw { display: flex; flex-direction: column; gap: var(--space-2); }
  .chip { width: 84px; height: 44px; border-radius: var(--radius-md); box-shadow: inset 0 0 0 0.5px var(--border-hairline); }
  .lbl { font: var(--type-mono-xs); color: var(--text-muted); letter-spacing: var(--tracking-mono); }
  .lbl b { color: var(--text-body); font-weight: 400; display: block; }
  .tag { font: var(--type-micro); text-transform: uppercase; letter-spacing: var(--tracking-label); color: var(--text-faint); }

</style>
</head>
<body>
<div style="display:flex;flex-direction:column;gap:10px">
  <div style="font:var(--type-hero);letter-spacing:var(--tracking-display);color:var(--text-title)">ouvi</div>
  <div style="font:var(--type-display);letter-spacing:var(--tracking-display);color:var(--text-title)">Suas reuniões, no seu Mac</div>
  <div style="font:var(--type-title-1);letter-spacing:var(--tracking-title);color:var(--text-title)">Transcrição impecável, offline</div>
  <div style="font:var(--type-title-2);color:var(--text-title)">Reunião de discovery — Superior Grocers</div>
  <div class="lbl">--type-hero 58/900 · --type-display 34/700 · --type-title-1 23/700 · --type-title-2 19/500</div>
</div>
</body>
</html>
